name: test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Race (game, assist, web)
        run: go test -race ./internal/game ./internal/assist ./internal/web
      - name: JavaScript syntax
        run: node --check internal/web/static/app.js && node --check internal/web/static/sw.js
