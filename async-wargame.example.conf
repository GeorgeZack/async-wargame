# Settings for async-wargame. Copy this to async-wargame.conf (next to
# where you start the server) and start it with just: ./async-wargame
# Or keep it anywhere and run: ./async-wargame -config /path/to/file
# Flags given on the command line override what's here.

# Where to listen. 127.0.0.1 is this machine only; :8080 accepts the LAN.
addr = 127.0.0.1:8080

# The campaign state file. Uploaded maps and the push key live next to it.
data = data/campaigns.json

# Set when a reverse proxy or tunnel (Caddy, Tailscale Funnel) sits in front.
# proxy = true

# Needed to create a room; joining doesn't need it. Leave unset to let anyone.
# host-password = something-long

# The referee's AI assistant: opencode, opencode-zen, ollama, local, or a
# base URL ending in /v1. Leave unset for no AI.
# ai = opencode
# ai-model = glm-5.2
# The key, either a file holding it (the key alone, or OPENCODE_API_KEY=...
# lines like OpenCode's own file) or the key itself.
# ai-key-file = ~/.config/opencode/api-key.env
# ai-key = sk-...

# For -ai local: llama.cpp's server and a GGUF model file.
# ai-local-model = ~/models/qwen3-8b-q4_k_m.gguf
# ai-llama-server = llama-server
# ai-context = 8192

# Web push notifications. Push services may write here about problems.
# push-contact = mailto:you@example.com
# no-push = true

# Extra modules and scenarios, beside the built-in ones.
# modules = /srv/aw-content
